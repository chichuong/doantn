services:
  - type: web
    name: karat-retail-fullstack
    runtime: node
    plan: free
    buildCommand: cd Frontend_Web && npm install && npm run build && cd ../Backend && npm install
    startCommand: cd Backend && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: jjcr7fcsmyeixric@ethereal.email
      - key: SMTP_PASS
        value: sNhSe38rdSA2z1txEz
      - key: SMTP_FROM
        value: "Karat Retail <no-reply@karats.studio>"
